# Проверка Debug: сборка и сборка в Release на каждой ветке и в каждом MR.
# Образ закреплён по digest, как в ci-template.

stages:
  - test

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_CLI_TELEMETRY_OPTOUT: "1"
  SDK_IMAGE: "mcr.microsoft.com/dotnet/sdk:10.0.404@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

build:
  stage: test
  image: $SDK_IMAGE
  script:
    - dotnet build Debug.sln -c Release
    - dotnet test Tests/Debug.Tests.csproj -c Release
