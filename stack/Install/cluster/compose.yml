x-connection: &connection
  CLUSTER_PG_HOST: ${CLUSTER_PG_HOST:?Set CLUSTER_PG_HOST}
  CLUSTER_PG_PORT: ${CLUSTER_PG_PORT:-5432}
  CLUSTER_PG_USER: ${CLUSTER_PG_USER:-pilotuser}
  CLUSTER_PG_PASSWORD: ${CLUSTER_PG_PASSWORD:?Set CLUSTER_PG_PASSWORD}
  CLUSTER_CONFIG_DATABASE: ${CLUSTER_CONFIG_DATABASE:-configurationdb}

x-server: &server
  image: ${PILOT_SERVER_IMAGE:?Set PILOT_SERVER_IMAGE}
  working_dir: /App
  entrypoint: ["/usr/bin/bash", "/cluster-entrypoint.sh"]

x-entrypoint: &entrypoint
  type: bind
  source: ./entrypoint.sh
  target: /cluster-entrypoint.sh
  read_only: true
  bind:
    create_host_path: false

x-databases: &databases
  type: bind
  source: ${CLUSTER_SHARED_ROOT:?Set CLUSTER_SHARED_ROOT}/databases
  target: /usr/share/ascon/databases
  bind:
    create_host_path: false

services:
  pilot:
    <<: *server
    hostname: ${CLUSTER_NODE_NAME:?Set CLUSTER_NODE_NAME}
    restart: unless-stopped
    command: [node]
    environment:
      <<: *connection
      CLUSTER_LOCK_SETTINGS: "1"
    ports: ["${CLUSTER_NODE_BIND:?Set CLUSTER_NODE_BIND}:${CLUSTER_NODE_PORT:-5545}:5545"]
    volumes:
      - *entrypoint
      - *databases
      - type: bind
        source: ../wait-for-postgres.sh
        target: /wait-for-postgres.sh
        read_only: true
        bind: &existing
          create_host_path: false
      - type: bind
        source: ${CLUSTER_SHARED_ROOT}/aspnet
        target: /root/.aspnet
        bind: *existing
      - type: bind
        source: ${CLUSTER_SHARED_ROOT}/license
        target: /usr/share/ASCON
        bind: *existing
      - type: bind
        source: ${CLUSTER_SHARED_ROOT}/server-settings
        target: /server-settings
        bind: *existing
      - type: bind
        source: ${CLUSTER_NODE_ROOT:?Set CLUSTER_NODE_ROOT}/indexes
        target: /node-indexes
        bind: *existing
      - type: bind
        source: ${CLUSTER_NODE_ROOT}/logs
        target: /App/logs
        bind: *existing

  initialize:
    <<: *server
    profiles: [tools]
    command: [initialize]
    environment:
      <<: *connection
      CLUSTER_REDIS_CONNECTION: ${CLUSTER_REDIS_CONNECTION:-}
      CLUSTER_PILOT_ADMIN: ${CLUSTER_PILOT_ADMIN:-}
      CLUSTER_PILOT_PASSWORD: ${CLUSTER_PILOT_PASSWORD:-}
    volumes:
      - *entrypoint
      - *databases
      - type: bind
        source: ${CLUSTER_SEED_ROOT:-./seed}
        target: /usr/share/ascon/pilot-server/settings
        read_only: true
        bind: *existing

  check-pg:
    image: postgres:16.16@sha256:30551eca978d79ccf49d037bc297b5670baea61a04ceca42ff7fd3100163d3ce
    profiles: [tools]
    entrypoint: ["/bin/bash", "/check-pg.sh"]
    environment:
      PGHOST: ${CLUSTER_PG_HOST:?Set CLUSTER_PG_HOST}
      PGPORT: ${CLUSTER_PG_PORT:-5432}
      PGUSER: ${CLUSTER_PG_USER:-pilotuser}
      PGPASSWORD: ${CLUSTER_PG_PASSWORD:?Set CLUSTER_PG_PASSWORD}
      PGCONNECT_TIMEOUT: 10
      CLUSTER_CONFIG_DATABASE: ${CLUSTER_CONFIG_DATABASE:-configurationdb}
    volumes:
      - type: bind
        source: ./check-pg.sh
        target: /check-pg.sh
        read_only: true
        bind: *existing
