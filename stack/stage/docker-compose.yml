# Контур stage: Pilot-Server, PostgreSQL и RustFS.
# Данные - {DATA_ROOT}/stage/... на хосте (кроме RustFS: его данные в томе Docker rustfs_data), своя сеть pilot-stage и своя папка данных PostgreSQL.
# Роль pilotuser создаётся при первом старте на пустой папке данных.
# Порт Pilot 5549, а не 5548: на Windows 5548 часто занят http.sys.
# Запуск: docker compose up -d (сеть создаётся один раз: docker network create pilot-stage).

name: pilot-stage

services:
  postgres-stage:
    image: postgres:16.16@sha256:30551eca978d79ccf49d037bc297b5670baea61a04ceca42ff7fd3100163d3ce
    container_name: postgres-stage
    restart: unless-stopped
    # pilot-server должен стартовать только когда Postgres принимает подключения, иначе база уходит в Broken
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    environment:
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?Задайте PG_SUPERUSER_PASSWORD в .env}
      PILOT_PG_PASSWORD: ${PILOT_PG_PASSWORD:?Задайте PILOT_PG_PASSWORD в .env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - ${DATA_ROOT:-C:/Ascon-Docker}/stage/postgres:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - pilot-stage

  rustfs-stage:
    # Тегом, без digest: образ приходит docker load из комплекта, а загруженный образ digest не имеет.
    # Индекс-дайджест rustfs/rustfs:1.0.5 для сверки: sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74.
    image: rustfs/rustfs:1.0.5
    container_name: rustfs-stage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # Имена MINIO_USER / MINIO_PASSWORD в .env исторические; значение - ключ и секрет доступа RustFS.
      RUSTFS_ACCESS_KEY: ${MINIO_USER:?Задайте MINIO_USER в .env}
      RUSTFS_SECRET_KEY: ${MINIO_PASSWORD:?Задайте MINIO_PASSWORD в .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "127.0.0.1:9020:9000"
      - "127.0.0.1:9021:9001"
    # Данные - в именованном томе Docker rustfs_data (не в DATA_ROOT): бинд-маунт папки Windows ломает составную загрузку S3.
    # Том при создании наследует владельца 10001 от образа, chown не нужен.
    volumes:
      - rustfs_data:/data
    networks:
      pilot-stage:
        aliases:
          - rustfs-stage

  pilot-server-stage:
    image: ${PILOT_SERVER_IMAGE:-registry.ascon.ru/project/pilotdev/pilot/pilot-server:release@sha256:6dc47fd5003a057bbbd0b601cad9452d51fa5850a9b8cbee3f99511909e9b874}
    container_name: pilot-server-stage
    restart: unless-stopped
    entrypoint: ["/usr/bin/bash", "/wait-for-postgres.sh"]
    environment:
      PG_WAIT_HOST: postgres-stage
    command: /usr/share/ascon/pilot-server/settings/settings.xml
    ports:
      - "${PILOT_PORT:-5549}:5545"
    volumes:
      - ../shared/wait-for-postgres.sh:/wait-for-postgres.sh:ro
      - ${DATA_ROOT:-C:/Ascon-Docker}/stage/databases:/usr/share/ascon/databases
      - ${DATA_ROOT:-C:/Ascon-Docker}/stage/aspnet:/root/.aspnet
      - ${DATA_ROOT:-C:/Ascon-Docker}/stage/license:/usr/share/ASCON
      - ${DATA_ROOT:-C:/Ascon-Docker}/stage/pilot-server/settings:/usr/share/ascon/pilot-server/settings
      - ${DATA_ROOT:-C:/Ascon-Docker}/stage/logs:/App/logs
      # Настройки сервера из админки («Серверы»): применяются wait-for-postgres.sh при старте контейнера.
      - ${DATA_ROOT:-C:/Ascon-Docker}/stage/server-settings:/server-settings
    depends_on:
      postgres-stage:
        condition: service_healthy
      rustfs-stage:
        condition: service_healthy
    networks:
      - pilot-stage

volumes:
  rustfs_data:

networks:
  pilot-stage:
    external: true
