name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'docfx.json', '.config/dotnet-tools.json', 'proadmin/src/ProAdmin/wwwroot/icon.svg', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'docfx.json', '.config/dotnet-tools.json', 'proadmin/src/ProAdmin/wwwroot/icon.svg', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet docfx docfx.json --warningsAsErrors
      - run: rm _site/manifest.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
