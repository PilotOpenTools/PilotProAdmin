name: Release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content proadmin/src/ProAdmin/PilotProAdmin.csproj -Raw)
          $version = $project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid project version: $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
              throw "Tag must be v$version."
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet test proadmin/PilotProAdmin.sln -c Release --nologo
      - run: dotnet test proadmin/migration/PilotMigration.sln -c Release --nologo
      - name: Check release restore
        shell: pwsh
        run: ./stack/build/selftest/release-restore-selftest.ps1
      - shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -Repository "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" -WithPortable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

  containers:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check and package cluster installer
        shell: bash
        run: |
          bash stack/build/selftest/cluster-selftest.sh
          mkdir images
          filename="PilotProAdmin-v$RELEASE_VERSION-cluster.tar.gz"
          git archive --format=tar.gz --output="images/$filename" --prefix="PilotProAdmin-v$RELEASE_VERSION/" HEAD \
            stack/Install/cluster \
            stack/Install/wait-for-postgres.sh \
            stack/Install/docs/cluster-installation.md \
            stack/Install/docs/Pilot-Server_cluster.md \
            proadmin/migration/README.md
          cd images
          sha256sum "$filename" > SHA256SUMS-CLUSTER.txt
      - name: Build and check images
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in pilotproadmin pilotproadmin-migration; do
            image="$repository:$RELEASE_VERSION"
            context=proadmin
            if [[ "$service" == pilotproadmin-migration ]]; then
              image="$repository-migration:$RELEASE_VERSION"
              context=proadmin/migration
            fi
            docker build --platform linux/amd64 --tag "$image" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$RELEASE_VERSION" "$context"
            docker run --detach --name "$service" --publish 127.0.0.1::8080 "$image"
            trap 'docker logs "$service"; docker rm --force --volumes "$service"' EXIT
            port=$(docker port "$service" 8080/tcp)
            result=$(curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 "http://$port/health")
            test "$result" = ok
            docker rm --force --volumes "$service"
            trap - EXIT
          done
          service=pilotproadmin-cluster-readiness
          docker run --detach --name "$service" --publish 127.0.0.1::8080 \
            --add-host pilot:127.0.0.1 \
            --env ClusterReadiness__Databases=smoke \
            --env ClusterReadiness__Login=smoke --env ClusterReadiness__Password=smoke \
            "$repository-migration:$RELEASE_VERSION" --cluster-readiness
          trap 'docker logs "$service"; docker rm --force --volumes "$service"' EXIT
          port=$(docker port "$service" 8080/tcp)
          result=$(curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 "http://$port/health")
          test "$result" = ok
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 "http://$port/ready")" = 503
          for attempt in {1..25}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$service")" == healthy ]]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$service")" = healthy
          docker rm --force --volumes "$service"
          trap - EXIT
      - name: Push images
        if: github.ref_type == 'tag'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$repository:$RELEASE_VERSION"
          docker push "$repository-migration:$RELEASE_VERSION"
          anonymous_config=$(mktemp -d)
          for image in "$repository:$RELEASE_VERSION" "$repository-migration:$RELEASE_VERSION"; do
            if ! docker --config "$anonymous_config" manifest inspect "$image" >/dev/null; then
              echo "::error::GHCR image $image is not readable without login. Set both packages to Public in GitHub Packages and rerun this tag."
              exit 1
            fi
          done
      - name: Package images for offline loading
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          filename="PilotProAdmin-v$RELEASE_VERSION-linux-amd64-images.tar.gz"
          cd images
          docker save "$repository:$RELEASE_VERSION" "$repository-migration:$RELEASE_VERSION" | gzip -n > "$filename"
          sha256sum "$filename" > SHA256SUMS-CONTAINERS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-release
          path: images/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-release
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: container-release
          path: artifacts
      - name: Package offline kit
        env:
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS.txt SHA256SUMS-CONTAINERS.txt
          # Lite и архив образов в одном zip: install.ps1 загружает образы из архива рядом с собой, без GHCR.
          offline="PilotProAdmin-v$RELEASE_VERSION-offline.zip"
          cp "PilotProAdmin-v$RELEASE_VERSION-lite.zip" "$offline"
          zip -0 -j -q "$offline" "PilotProAdmin-v$RELEASE_VERSION-linux-amd64-images.tar.gz"
          sha256sum "$offline" >> SHA256SUMS-CONTAINERS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          sha256sum --check SHA256SUMS-CONTAINERS.txt
          sha256sum --check SHA256SUMS-CLUSTER.txt
          assets=("PilotProAdmin-v$RELEASE_VERSION-lite.zip"
                  "PilotProAdmin-v$RELEASE_VERSION-win-x64-portable.zip"
                  "PilotProAdmin-v$RELEASE_VERSION-linux-amd64-images.tar.gz"
                  "PilotProAdmin-v$RELEASE_VERSION-offline.zip"
                  "PilotProAdmin-v$RELEASE_VERSION-cluster.tar.gz"
                  SHA256SUMS.txt SHA256SUMS-CONTAINERS.txt SHA256SUMS-CLUSTER.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "PilotProAdmin $GITHUB_REF_NAME" --generate-notes "${assets[@]}"
          fi
